<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Myotrek Shoulder (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D stage, floating control panel left, info panel right, live caption bottom. Clinical light-box feel. */
:root{
  --bg:#E9EEF1; --bg-2:#F7FAFB; --panel:rgba(255,255,255,.82); --panel-solid:#FFFFFF;
  --line:rgba(22,44,60,.11); --fg:#16222C; --fg-2:#4C5B68; --fg-3:#7C8994;
  --accent:#0B6B70; --accent-soft:#D6EBEB; --accent-fg:#FFFFFF;
  --con:#D9472B; --ecc:#4F55D0; --iso:#C88A10; --rest:#C49590;
  --bone:#ECE5D5; --skin:#E6C2AC; --shadow:0 10px 30px -12px rgba(20,40,60,.25), 0 1px 2px rgba(20,40,60,.06);
  --font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1318; --bg-2:#1A222B; --panel:rgba(22,29,37,.84); --panel-solid:#18202A;
  --line:rgba(255,255,255,.09); --fg:#E6ECF1; --fg-2:#A7B3BE; --fg-3:#76838F;
  --accent:#4FC2C3; --accent-soft:rgba(79,194,195,.15); --accent-fg:#06272A;
  --con:#FF6A4D; --ecc:#8C90FF; --iso:#F0B43C; --rest:#A97F7B;
  --bone:#D6CEBD; --skin:#C9A28C; --shadow:0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1318; --bg-2:#1A222B; --panel:rgba(22,29,37,.84); --panel-solid:#18202A;
  --line:rgba(255,255,255,.09); --fg:#E6ECF1; --fg-2:#A7B3BE; --fg-3:#76838F;
  --accent:#4FC2C3; --accent-soft:rgba(79,194,195,.15); --accent-fg:#06272A;
  --con:#FF6A4D; --ecc:#8C90FF; --iso:#F0B43C; --rest:#A97F7B;
  --bone:#D6CEBD; --skin:#C9A28C; --shadow:0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg); color:var(--fg); font:15px/1.5 var(--font-body); overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{position:relative; height:100%; background:radial-gradient(ellipse 60% 70% at 52% 46%, var(--bg-2), var(--bg) 75%)}
#stage{position:absolute; inset:0}
#stage canvas{display:block; width:100%; height:100%; touch-action:none}
.labels{position:absolute; inset:0; pointer-events:none; z-index:1}   /* own stacking layer: the 3D library gives each label its own z-index */

/* header */
.top{position:absolute; top:16px; left:16px; right:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; pointer-events:none; z-index:5}
.top > *{pointer-events:auto}
.brand{display:flex; align-items:center; gap:10px}
.brand svg{width:30px; height:30px}
.brand b{font:700 21px/1 var(--font-display); letter-spacing:-.01em}
.backlink{display:inline-flex; align-items:center; gap:4px; padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font-weight:700; font-size:13px; text-decoration:none}
.backlink:hover{border-color:var(--accent); color:var(--accent)}
.crumb{color:var(--fg-3); font-size:13px; margin-left:4px}
.crumb strong{color:var(--fg-2); font-weight:700}
.top-right{display:flex; gap:8px; align-items:center}

.seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px; backdrop-filter:blur(12px)}
.seg button{border:0; background:transparent; padding:6px 12px; border-radius:999px; cursor:pointer; font-size:13px; color:var(--fg-2); line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); font-weight:700}
.seg.block{display:flex; border-radius:10px}
.seg.block button{flex:1; border-radius:8px; padding:7px 6px; display:flex; flex-direction:column; align-items:center; gap:1px}
.seg.block small{font-size:11px; opacity:.8; font-weight:400}
.iconbtn{width:36px; height:36px; display:grid; place-items:center; border-radius:999px; border:1px solid var(--line); background:var(--panel); cursor:pointer; backdrop-filter:blur(12px)}
.iconbtn svg{width:18px; height:18px}

/* panels */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); backdrop-filter:blur(16px) saturate(1.15); -webkit-backdrop-filter:blur(16px) saturate(1.15)}
.controls{position:absolute; left:16px; top:72px; width:290px; max-height:calc(100% - 88px); overflow:auto; padding:16px; display:flex; flex-direction:column; gap:18px; z-index:4}
.info{position:absolute; right:16px; top:72px; bottom:16px; width:350px; overflow:auto; padding:0; z-index:4; display:flex; flex-direction:column}
h3{margin:0 0 8px; font:700 11px/1.2 var(--font-body); letter-spacing:.09em; text-transform:uppercase; color:var(--fg-3)}

.readout{display:flex; align-items:baseline; gap:8px; margin-bottom:6px}
.readout .num{font:500 40px/1 var(--font-mono); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.readout .deg{font:500 22px/1 var(--font-mono); color:var(--fg-3); margin-left:-6px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; background:var(--accent-soft); color:var(--fg)}
.pill i{width:8px; height:8px; border-radius:50%; background:var(--fg-3); display:block}

input[type=range]{width:100%; accent-color:var(--accent); margin:6px 0 2px}
.scale{display:flex; justify-content:space-between; font-size:11.5px; color:var(--fg-3)}
.btnrow{display:flex; gap:6px; margin-top:10px}
.btn{flex:1; border:1px solid var(--line); background:var(--panel-solid); padding:8px 6px; border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); border-color:transparent}
.btn svg{width:14px; height:14px}
.hint{margin:8px 0 0; font-size:12.5px; color:var(--fg-3)}
.toggles{display:flex; flex-wrap:wrap; gap:6px}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:5px 10px; border:1px solid var(--line); border-radius:999px; cursor:pointer; background:var(--panel-solid)}
.chk input{accent-color:var(--accent); margin:0}
.linkbtn{border:0; background:none; color:var(--accent); font-weight:700; cursor:pointer; padding:4px 0; font-size:13px}

/* info panel */
.tabs{display:flex; gap:4px; padding:12px 12px 0; position:sticky; top:0; background:var(--panel); backdrop-filter:blur(16px); z-index:1; border-bottom:1px solid var(--line)}
.tabs button{border:0; background:none; padding:8px 10px 10px; cursor:pointer; color:var(--fg-3); font-weight:700; font-size:14px; border-bottom:2px solid transparent; margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg); border-color:var(--accent)}
.pane{padding:14px 16px 18px; display:flex; flex-direction:column; gap:14px}
.group-h{display:flex; justify-content:space-between; align-items:baseline; margin-top:2px}
.mlist{display:flex; flex-direction:column; gap:6px}
.mrow{display:grid; grid-template-columns:12px 1fr auto; gap:4px 10px; align-items:center; text-align:left; padding:9px 10px; border:1px solid var(--line); border-radius:11px; background:var(--panel-solid); cursor:pointer; width:100%}
.mrow:hover{border-color:var(--accent)}
.mrow .dot{width:12px; height:12px; border-radius:50%; background:var(--rest); grid-row:span 2; transition:background .2s}
.mrow .nm{font-weight:700; font-size:14px}
.mrow .role{font-size:11.5px; color:var(--fg-2); justify-self:end; white-space:nowrap}
.mrow .st{font-size:12.5px; color:var(--fg-2)}
.mrow .bar{grid-column:2 / 4; height:4px; border-radius:2px; background:var(--line); overflow:hidden}
.mrow .bar span{display:block; height:100%; width:0; background:var(--fg-3); border-radius:2px; transition:width .12s linear, background .2s}
.legend{display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:12.5px; color:var(--fg-2); padding-top:12px; border-top:1px solid var(--line)}
.legend span{display:flex; align-items:center; gap:7px}
.legend i{width:10px; height:10px; border-radius:50%; flex:none}
.note{font-size:12.5px; color:var(--fg-3); margin:0}

.detail h2{font:700 24px/1.15 var(--font-display); margin:0; letter-spacing:-.01em; text-wrap:balance}
.detail .lede{margin:0; font-size:15.5px}
.kv{display:grid; gap:10px}
.kv div{display:grid; gap:2px}
.kv dt{font:700 11px/1.3 var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3)}
.kv dd{margin:0; font-size:14px}
.kv ul{margin:0; padding-left:18px}
.kv li{margin:2px 0}
.kvt{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px}
.kvt th,.kvt td{text-align:left; vertical-align:top; padding:5px 8px 5px 0; border-bottom:1px solid var(--line)}
.kvt thead th{font:700 10.5px/1.3 var(--font-body); color:var(--fg-3); padding-top:0}
.kvt tbody th{font-weight:700}
.kvt tr:last-child > *{border-bottom:0}
.special{border:1px solid var(--accent); background:var(--accent-soft); border-radius:12px; padding:12px 14px; display:grid; gap:4px}
.special b{font-size:13px; color:var(--accent)}
.special p{margin:0; font-size:13.5px}
.roots{font-family:var(--font-mono); font-size:12.5px; background:var(--accent-soft); padding:1px 6px; border-radius:6px; margin-left:4px; white-space:nowrap}
.statusbox{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--accent-soft); font-size:13.5px}
.statusbox i{width:12px; height:12px; border-radius:50%; flex:none}
.back{align-self:flex-start}

/* caption */
.caption{position:absolute; left:322px; right:382px; bottom:16px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:6; pointer-events:none}
.caption .panel{pointer-events:auto; padding:10px 14px; display:flex; gap:14px; align-items:center; width:100%; max-width:640px; position:relative}
.caption p{margin:0; font-size:14px; line-height:1.4; text-wrap:pretty}
.why{font-size:12.5px!important; color:var(--fg-2)}
.capB .headline{flex:1; font-weight:700; font-size:15px!important}
/* caption: one fixed-size line; "More" lists every phase of the exercise and highlights the live one */
.capB{height:52px}
.capB .headline{flex:1; min-width:0; font-weight:700; font-size:15px!important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.why{font-size:12.5px!important; color:var(--fg-2)}
.more-h{display:flex; justify-content:space-between; align-items:center}
.phases{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.phases li{padding:6px 10px; border-radius:9px; border:1px solid transparent; font-size:13.5px; line-height:1.4}
.phases li b{display:flex; align-items:center; gap:6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-3)}
.phases li b i{width:8px; height:8px; border-radius:50%}
.phases li.on{border-color:var(--accent); background:var(--accent-soft)}
.phases li.on b{color:var(--fg)}
.morebox{max-height:min(60vh, 460px); overflow:auto; position:absolute; left:0; right:0; bottom:calc(100% + 8px); padding:12px 14px; border-radius:14px; background:var(--panel-solid); border:1px solid var(--line); box-shadow:var(--shadow); display:grid; gap:6px}
/* view toggles */
.viewtools{position:absolute; left:322px; top:72px; right:440px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; z-index:4; pointer-events:none}
.viewtools > *{pointer-events:auto}
.viewmenu{position:relative; display:flex; align-items:center; gap:6px}
.viewmenu .iconbtn{width:40px; height:40px; box-shadow:var(--shadow)}
.viewpop{position:absolute; left:0; top:calc(100% + 6px); padding:8px; display:grid; gap:2px; min-width:150px}
.vrow{display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 6px; border-radius:6px; cursor:pointer}
.vrow:hover{background:var(--accent-soft)}
.vrow input{accent-color:var(--accent); margin:0}
.effort{flex:none; width:96px; display:grid; gap:4px}
.effort small{font-size:11px; color:var(--fg-3); letter-spacing:.06em; text-transform:uppercase; font-weight:700}
.effort .bar{height:6px; border-radius:3px; background:var(--line); overflow:hidden}
.effort .bar span{display:block; height:100%; width:0; background:var(--accent); transition:width .15s}

/* 3D labels */
.tag{pointer-events:auto; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--fg); font:700 11.5px/1 var(--font-body); padding:5px 8px; border-radius:999px; white-space:nowrap; box-shadow:var(--shadow); backdrop-filter:blur(8px)}
.tag:hover,.tag.on{border-color:var(--accent); color:var(--accent)}
.tag.dim{opacity:.35}
.tag.clash{opacity:0; pointer-events:none}
.deglabel{font:500 12px/1 var(--font-mono); color:var(--accent); background:var(--panel); padding:3px 6px; border-radius:6px; border:1px solid var(--line)}
.ticklabel{font:500 10.5px/1 var(--font-mono); color:var(--fg-3)}

.seg.block.sub{margin-top:6px; background:transparent; border-style:dashed}
.seg.block.sub button{font-size:12px; padding:5px 4px}
.seg.block.sub small{font-size:10px}
.seg.block.sub button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
.slider90{position:relative}
.slider90 input{position:relative; z-index:1}
/* left is set from the slider range in script (thumb ≈ 16px) */
.mark90{position:absolute; left:calc(8px + (100% - 16px) * 90 / 135); top:100%; transform:translate(-50%, 2px); z-index:2;
  border:1px solid var(--accent); background:var(--panel-solid); color:var(--accent); font:700 11px/1 var(--font-mono); padding:3px 6px; border-radius:999px; cursor:pointer}
.mark90::before{content:""; position:absolute; left:50%; bottom:100%; width:1px; height:9px; background:var(--accent); transform:translateX(-50%)}
.mark90:hover{background:var(--accent); color:var(--accent-fg)}
.zoom{position:absolute; right:382px; top:72px; display:flex; flex-direction:column; gap:6px; z-index:4}
.zoom .iconbtn{width:40px; height:40px; box-shadow:var(--shadow)}
.readout.sm .num{font-size:28px}
.readout.sm .deg{font-size:16px; margin-left:-6px}
.echart{margin:12px 0 0; padding:10px 10px 8px; border:1px solid var(--line); border-radius:12px; background:var(--panel-solid)}
.echart figcaption{font:700 11px/1.2 var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3); margin-bottom:4px}
.echart svg{display:block; width:100%; height:auto; touch-action:none; cursor:crosshair}
.echart .grid{stroke:var(--line); stroke-width:1}
.echart .zero{stroke:var(--fg-3); stroke-width:1}
.echart .tick{font:500 10px var(--font-mono); fill:var(--fg-3)}
.echart .ser{fill:none; stroke:var(--fg-3); stroke-width:1.5; opacity:.45; stroke-linecap:round; stroke-linejoin:round}
.echart .ser.on{stroke:var(--accent); stroke-width:2.5; opacity:1}
.echart .lbl{font:700 10.5px var(--font-body); fill:var(--fg-3)}
.echart .lbl.on{fill:var(--fg)}
.echart .dot{fill:var(--accent); stroke:var(--panel-solid); stroke-width:2}
.echart .guide{stroke:var(--fg-3); stroke-width:1; stroke-dasharray:2 3}
.echart-key{display:flex; justify-content:space-between; gap:6px; font-size:10.5px; color:var(--fg-3); margin-top:2px}
.echart-read{font-size:12px; line-height:1.4; color:var(--fg-2); height:2.8em; overflow:hidden; margin-top:4px}   /* always two lines tall, so the chart never resizes */
.heads{display:grid; gap:6px; padding:8px 10px 2px 32px}
.hrow{display:grid; grid-template-columns:1fr auto; gap:3px 8px; font-size:12px; color:var(--fg-2); align-items:center}
.hrow .hl{font-family:var(--font-mono); font-size:11px; color:var(--fg-3)}
.hrow .bar{grid-column:1 / 3; height:3px; border-radius:2px; background:var(--line); overflow:hidden}
.hrow .bar span{display:block; height:100%; width:0; border-radius:2px; transition:width .12s linear}
.rotlbl{font-size:13px; color:var(--fg-2); font-weight:700; white-space:nowrap}
.readout{flex-wrap:wrap}
.pill{white-space:nowrap}
.loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--fg-3); font-size:14px; pointer-events:none}

@media (max-width: 900px){
  body{overflow:auto}
  .app{height:auto; min-height:100%}
  #stage{position:relative; height:58vh; min-height:340px}
  .top{position:absolute}
  .crumb{display:none}
  .controls,.info{position:static; width:auto; max-height:none; margin:0 16px 12px}
  .info{overflow:visible}
  .caption{position:static; margin:0 16px 12px}
  .caption .panel{width:100%}
  .zoom{right:12px; top:auto; bottom:12px}
  .viewtools{left:12px; right:12px; top:60px}
  .caption{gap:12px}
}
.backlink{white-space:nowrap}
@media (max-width: 480px){ .brand b{display:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

.seg.block.grid2{display:grid; grid-template-columns:repeat(6, 1fr); gap:2px}
.seg.block.grid2 button{grid-column:span 2; font-size:12.5px; padding:7px 3px; hyphens:manual}
.seg.block.grid2 button:nth-child(n+4){grid-column:span 3}
.seg.block button:disabled{opacity:.45; cursor:not-allowed}
.planelbl{font:700 11px/1.2 var(--font-body); color:var(--fg-3); background:var(--panel); border:1px dashed var(--line); padding:3px 7px; border-radius:7px; white-space:nowrap; pointer-events:none}
.planelbl.on,.planelbl.deg,.planelbl.blade{color:var(--accent); border:1px solid var(--accent)}
.planelbl.deg{font-family:var(--font-mono); font-weight:500; padding:2px 5px}
.tag.bladetag{border:1px dashed var(--accent); color:var(--accent)}
.tag.bladetag.on{border-style:solid; background:var(--accent); color:var(--accent-fg)}
.rhythm{font-size:12px; color:var(--fg-2); margin:-2px 0 4px; min-height:1.4em}
.rhythm b{font-family:var(--font-mono); font-weight:500; color:var(--fg)}
</style>

    <div class="viewtools">
      <div class="viewmenu">

        <div class="panel viewpop" id="viewMenu" hidden>

        </div>
      </div>
    </div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button class="iconbtn" id="zoomIn" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="iconbtn" id="zoomOut" aria-label="Zoom out" title="Zoom out (−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="iconbtn" id="resetView" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    </div>
  </div>

  <header class="top">

function muscleMaterial(){
  const m = new THREE.MeshPhysicalMaterial({ roughness:.42, clearcoat:.35, clearcoatRoughness:.35, sheen:.4, envMapIntensity:.55, transparent:true });
  m.userData.u = { uTime:{value:0}, uFlow:{value:0}, uActive:{value:0}, uStripe:{value:new THREE.Color()} };
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, m.userData.u);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', 'attribute float along;\nvarying float vAlong;\n#include <common>')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvAlong = along;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', 'uniform float uTime; uniform float uFlow; uniform float uActive; uniform vec3 uStripe;\nvarying float vAlong;\n#include <common>')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float dC = abs(vAlong - 0.5);
        float stripe = smoothstep(0.35, 0.95, 0.5 + 0.5 * sin(dC * 46.0 + uTime * uFlow * 5.0));
        float pulse = 0.5 + 0.5 * sin(uTime * 3.5);
        float glow = (abs(uFlow) < 0.5) ? (0.18 + 0.22 * pulse) : (0.12 + 0.5 * stripe);
        totalEmissiveRadiance += uStripe * uActive * glow;`);
  };
  return m;
}

/* ------------------------------------------------------------------ physiology model (simplified, for teaching) */
const OPPOSITE = { con:'ecc', ecc:'con', iso:'iso' };

// the load's moment about the shoulder as a fraction of its maximum: > 0 pulls the arm down toward 0°

function exLoad(k, th){
  switch (k){
    case 'front': case 'lat': case 'scapRaise': return Math.sin(th*DEG);                           // dumbbell, standing
    case 'extP': return Math.sin((th - 90)*DEG);                                 // dumbbell, lying face down
    case 'extB': return clamp(-.85 + .35*Math.sin(th*DEG), -1, 1);               // band pulling the arm forward, simplified
    case 'pull': case 'scapPull': return clamp(-1 + .45*Math.sin(th*DEG), -1, 1);                 // band pulling the arm up and out, minus the arm's weight
  }
  return 0;
}
const better = (p, q) => !p || (q && q[0] > p[0]) ? q : p;
function shoulderPlan(){
  const k = posture(), th = state.theta, v = state.vel, moving = Math.abs(v) > 4;
  let phase = moving ? (v > 0 ? 'pos' : 'neg') : 'hold';
  const tau = exLoad(k, th), s = tau >= 0 ? 1 : -1;
  if (phase === 'hold' && Math.abs(tau) < .12) phase = 'rest';
  state.phase = phase; state.workSign = s;
  const plan = new Map();
  if (phase === 'rest') return [plan, 0];
  const type = phase === 'hold' ? 'iso' : (phase === 'pos') === (s > 0) ? 'con' : 'ecc';
  state.workType = type;
  let demand = .18 + .82*Math.abs(tau);
  if (type === 'ecc') demand *= .72;
  const coact = .06 + .06*Math.min(1, Math.abs(v)/150) + .04*demand;
  const ck = { flex:'f', abd:'a', scap:'s' }[plane()];
  for (const o of TUBES){
    const t = o.t; let c = (t.c && t.c[ck]) || 0, p = null;
    if (t.fromFlexed && ck === 'f' && th < 5) c = 0;                              // sternocostal pec only extends a flexed arm
    if (t.init && ck === 'a') c *= th < 30 ? 1.15 : .8;                           // supraspinatus: most active starting abduction
    if (c*s > 0) p = [demand*Math.abs(c), type, Math.abs(c) >= .8 ? 'prime' : 'syn'];
    else if (c*s < 0 && Math.abs(c) >= .5) p = [coact, OPPOSITE[type], 'ant'];
    if (t.up) p = s > 0 ? (th > 8 ? [demand*t.up*clamp((th - t.upFrom)/50, .15, 1), type, 'scap'] : null) : [coact*.8, OPPOSITE[type], 'ant'];
    if (t.down && s < 0) p = [demand*t.down, type, 'scapd'];
    if (t.retract && state.ex === 'ext') p = better(p, [.2 + .35*demand, 'iso', 'stab']);

}

function updatePhysiology(dt){
  const [plan, demand] = shoulderPlan();
  state.demand += (demand - state.demand) * (1 - Math.exp(-dt*8));
  for (const o of TUBES){
    const [target, type, role] = plan.get(o) || [.02, 'rel', null];
    o.act += (target - o.act) * (1 - Math.exp(-dt*8));
    o.ctype = type; o.role = role;
  }
  // a muscle shows its busiest part
  for (const m of MUSCLES){
    const top = m.tubeObjs.reduce((a, b) => (b.role && !a.role) || (b.role && b.act > a.act) ? b : a);
    m.act = top.act; m.contraction = top.ctype; m.role = top.role;
    if (top.role) for (const o of m.tubeObjs) if (o.role && ROLE_RANK[o.role] > ROLE_RANK[m.role] && o.act > .08){ m.role = o.role; }
  }
}

/* ------------------------------------------------------------------ motion: playback + smoothing */
function stopAnim(){ state.anim = null; state.loop = false; syncButtons(); }

function stepMotion(dt){

    const d = state.anim.to - state.goal;
    const speed = 55 * clamp(.3 + Math.abs(d)/35, .3, 1), s = speed * dt;
    if (Math.abs(d) <= s){
      state.goal = state.anim.to;
      if (state.loop){ const [a, b] = POSTURES[posture()].loop; state.loopDir *= -1; state.anim = { to: state.loopDir > 0 ? b : a }; state.hold = .9; }
      else { state.anim = null; syncButtons(); }
    } else state.goal += Math.sign(d) * s;

  state.theta += (state.goal - state.theta) * (1 - Math.exp(-dt*14));
  state.vel += ((state.theta - prev) / Math.max(dt, 1e-3) - state.vel) * (1 - Math.exp(-dt*12));
  state.other += (0 - state.other) * (1 - Math.exp(-dt*5));                       // the previous movement's angle glides back to 0
  // posture: glide when the exercise changes

/* ------------------------------------------------------------------ picking + dragging the arm */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let dragging = false, down = null;
function setRay(e){

}
function pick(){
  const objs = [...muscleMeshes.filter(o => inSel(o.userData.muscle)), ...(showBones ? boneParts : []), ...armParts];
  return ray.intersectObjects(objs.filter(o => o.visible), false)[0] || null;
}

}

  const sp = SCAP_PLANE*DEG, n = ({ flex:new V3(0,0,1), abd:new V3(1,0,0), scap:new V3(Math.cos(sp), 0, -Math.sin(sp)) })[plane()].transformDirection(body.matrixWorld);

let tween = null;

      <button class="mrow" data-sub="${x.id}"><i class="dot"></i><span class="nm">${x.name}</span><span class="role"></span><span class="st"></span></button>`).join('')}</div>
    <p class="note">Tap a muscle here or in the 3D view for its details.</p>

    $('backBtn').onclick = () => select(null);

  }
  const list = a => `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>`;

    <div class="statusbox" id="detailStatus"><i></i><span></span></div>
    <dl class="kv">
      ${L ? `
      <div><dt>Origin</dt><dd>${list(m.origin)}</dd></div>
      <div><dt>Insertion</dt><dd>${list(m.insertion)}</dd></div>
      <div><dt>Innervation</dt><dd>${m.nerve} <span class="roots">${m.roots}</span></dd></div>
      <div><dt>Blood supply</dt><dd>${m.blood}</dd></div>
      <div><dt>Actions</dt><dd>${list(m.actions)}</dd></div>
      <div><dt>Position effects</dt><dd>${m.position}</dd></div>
      <div><dt>Palpation</dt><dd>${m.palpation}</dd></div>
      <div><dt>Clinical notes</dt><dd>${list(m.clinical)}</dd></div>` : `
      <div><dt>Where it is</dt><dd>${m.where}</dd></div>
      <div><dt>You use it for</dt><dd>${m.everyday}</dd></div>

}
function updateDetailStatus(){
  const m = state.selected, w = words();
  if (m && m.isGroup){
    if (m === BLADE && $('bladeStatus')) $('bladeStatus').querySelector('span').textContent = state.mode === 'learner'

}
function renderJoint(){

/* ------------------------------------------------------------------ effort chart (learner): load about the shoulder vs angle */
const CH = { w:258, h:132, l:8, r:8, t:16, b:22 };
const rng = () => RANGE[plane()];
const cx = th => { const [lo, hi] = rng(); return CH.l + (th - lo) / (hi - lo) * (CH.w - CH.l - CH.r); };
const cy = v => CH.t + (1 - v) / 2 * (CH.h - CH.t - CH.b);
const chartKeys = () => EX_OF[plane()].map(ex => ex === 'ext' ? (state.load === 'band' ? 'extB' : 'extP') : ex);
const CHART_LBL = { front:[40,1], extP:[20,-1], extB:[150,-1], lat:[40,1], pull:[120,-1], scapRaise:[40,1], scapPull:[120,-1] };
const CHART_NAME = { front:'Front raise', extP:'Prone extension', extB:'Band extension', lat:'Lateral raise', pull:'Band pull-down', scapRaise:'Full can scaption', scapPull:'Band pull-down' };
function drawChart(){
  const svg = $('echartSvg'); if (!svg || $('echart').hidden) return;
  const [lo, hi] = rng(), cur = posture();
  const series = chartKeys().map(k => {
    let d = '';
    for (let th = lo; th <= hi; th += 2.5) d += (th === lo ? 'M' : 'L') + cx(th).toFixed(1) + ' ' + cy(exLoad(k, th)).toFixed(1);
    return { k, d, on: k === cur };
  }).sort((a, b) => a.on - b.on);
  const [a, side] = CHART_LBL[cur], v = exLoad(cur, a);
  svg.innerHTML = `
    <line class="grid" x1="${cx(90)}" x2="${cx(90)}" y1="${CH.t}" y2="${CH.h - CH.b}"/>
    ${lo < 0 ? `<line class="grid" x1="${cx(0)}" x2="${cx(0)}" y1="${CH.t}" y2="${CH.h - CH.b}"/>` : ''}
    <line class="zero" x1="${CH.l}" x2="${CH.w - CH.r}" y1="${cy(0)}" y2="${cy(0)}"/>
    ${[lo, ...(lo < 0 ? [0] : []), 90, hi].map(t => `<text class="tick" x="${cx(t)}" y="${CH.h - 6}" text-anchor="${t === lo ? 'start' : t === hi ? 'end' : 'middle'}">${t}°</text>`).join('')}
    ${series.map(sr => `<path class="ser${sr.on ? ' on' : ''}" d="${sr.d}"/>`).join('')}
    <text class="lbl on" x="${cx(a)}" y="${cy(v) + side*10 + (side > 0 ? 4 : 0)}" text-anchor="middle">${CHART_NAME[cur]}</text>
    <line class="guide" id="chGuide" y1="${CH.t}" y2="${CH.h - CH.b}" visibility="hidden"/>
    <circle class="dot" id="chDot" r="4.5"/>`;
  const [up, dn] = PW[plane()].grp[1];
  $('keyUp').textContent = `Above the line: ${up} working`;
  $('keyDown').textContent = `Below: ${dn} working`;
  updateChartDot();
}
function updateChartDot(){
  if ($('echart').hidden) return;
  const dot = $('chDot'); if (!dot) return;
  dot.setAttribute('cx', cx(state.theta)); dot.setAttribute('cy', cy(exLoad(posture(), state.theta)));
  if (!chartHover) $('echartRead').textContent = chartText(state.theta, 'Now');
}
function chartText(th, prefix){
  const v = exLoad(posture(), th), pct = Math.round(Math.abs(v) * 100), [up, dn] = PW[plane()].grp[1];
  if (pct < 4) return `${prefix} at ${Math.round(th)}°: almost no load on the shoulder`;
  return `${prefix} at ${Math.round(th)}°: ${pct}% of peak load, ${v > 0 ? up : dn} working`;
}
let chartHover = false;
function chartAngle(e){
  const r = $('echartSvg').getBoundingClientRect(), x = (e.clientX - r.left) / r.width * CH.w, [lo, hi] = rng();
  return clamp(lo + (x - CH.l) / (CH.w - CH.l - CH.r) * (hi - lo), lo, hi);
}
$('echartSvg').addEventListener('pointermove', e => {
  const th = chartAngle(e), g = $('chGuide'); chartHover = true;
  g.setAttribute('x1', cx(th)); g.setAttribute('x2', cx(th)); g.setAttribute('visibility', 'visible');
  $('echartRead').textContent = chartText(th, 'Hover');
  if (e.buttons){ stopAnim(); state.goal = th; }
});
$('echartSvg').addEventListener('pointerdown', e => { stopAnim(); state.goal = chartAngle(e); });
$('echartSvg').addEventListener('pointerleave', () => { chartHover = false; $('chGuide')?.setAttribute('visibility', 'hidden'); });

/* ------------------------------------------------------------------ caption: short live headline + "More" with every phase */
function phaseList(){
  const L = L1(), w = words(), key = posture(), N = PHASE_NAMES[key], grp = POSTURES[key].group;
  const typeFor = ph => ph === 'hold' ? 'iso' : ph === grp ? 'con' : 'ecc';
  const list = N.order.map(k => ({ k, t: k === 'rest' ? w.rest : k === 'hold' ? w.hold : N[k][L], type: k === 'rest' ? 'rel' : typeFor(k), text:CAPTIONS[key][k][L] }));
  if (POSTURES[key].load === 'db' && POSTURES[key].plane === 'flex') list.push(   // the load can only reverse in the sagittal plane
    { k:'takeover', t: L ? 'Load reverses' : (key === 'front' ? 'Arm behind you' : 'Past straight down'), type:'con', text:CAPTIONS.takeover[L] });
  return list;
}
function liveKey(){
  const g = POSTURES[posture()].group === 'pos' ? 1 : -1;
  return state.phase !== 'rest' && state.workSign !== g ? 'takeover' : state.phase;
}
const exTitle = () => EX_TITLE[posture()][L1()];
function shortWho(p){
  const w = words(), pos = POSTURES[posture()].group === 'pos';
  if (p.k === 'takeover') return state.mode === 'learner' ? 'antagonists take over' : 'opposite muscles take over';
  const who = PW[plane()].grp[L1()][pos ? 0 : 1];
  return `${who} ${w[p.type].toLowerCase()}`;
}
let moreKey = '';
function updateCaption(){
  const list = phaseList(), now = liveKey(), cur = list.find(p => p.k === now);
  const short = cur && now !== 'rest' ? `${cur.t} · ${shortWho(cur)}` : words().rest;
  if ($('headTxt').textContent !== short) $('headTxt').textContent = short;
  if (!$('moreBox').hidden) renderMore(list, now);
}
function renderMore(list = phaseList(), now = liveKey()){
  const why = WHY[posture()][L1()];
  const key = state.mode + '|' + posture() + '|' + why;
  if (key !== moreKey){
    moreKey = key;
    $('moreTitle').textContent = exTitle();
    $('morePhases').innerHTML = list.map(p => `<li data-k="${p.k}"><b><i style="background:var(--${p.type === 'rel' ? 'rest' : p.type})"></i>${p.t}</b>${p.text}</li>`).join('');
    $('moreWhy').textContent = why;
  }
  $('morePhases').querySelectorAll('li').forEach(li => li.classList.toggle('on', li.dataset.k === now));
}
function openMore(){ moreKey = ''; $('moreBox').hidden = false; renderMore(); $('moreBtn').setAttribute('aria-expanded', true); }
function closeMore(){ $('moreBox').hidden = true; $('moreBtn').setAttribute('aria-expanded', false); }
$('moreBtn').onclick = () => $('moreBox').hidden ? openMore() : closeMore();
$('moreClose').onclick = closeMore;

// labels of the isolated muscle (or its heads) always show, nudged up or down if they overlap; other labels hide when they clash
function declutterLabels(){
  const placed = [], sel = state.selected, items = [];
  for (const m of MUSCLES){
    items.push({ l:m, must:!!sel && inSel(m), p:(inSel(m) ? 2 : 0) + m.act });
    for (const o of m.tubeObjs) if (o.label3d) items.push({ l:o, must:true, p:3 + o.act });
  }
  items.push({ l:BLADE, must:true, p:9 });
  items.push({ l:CUFF, must:false, p:(sel ? 0 : 2) + Math.max(...CUFF.members.map(m => m.act)) });
  items.sort((a, b) => b.must - a.must || b.p - a.p);
  const clashes = r => placed.some(q => r.left < q.right + 2 && r.right > q.left - 2 && r.top < q.bottom + 2 && r.bottom > q.top - 2);
  for (const { l, must } of items){
    const el = l.labelEl; if (!l.label3d.visible) continue;
    el.style.marginTop = '';
    let r = el.getBoundingClientRect(), hit = clashes(r);
    if (hit && must){
      for (const dy of [24, -24, 48, -48, 72, -72]){
        const r2 = new DOMRect(r.x, r.y + dy, r.width, r.height);
        if (!clashes(r2)){ el.style.marginTop = dy + 'px'; r = r2; hit = false; break; }
      }
    }
    el.classList.toggle('clash', hit);
    if (!hit) placed.push(r);
  }
}
function updateHUD(){
  const w = words(), L = state.mode === 'learner';
  $('angleVal').textContent = Math.round(state.theta);
  if (document.activeElement !== $('angle')) $('angle').value = Math.round(state.goal);
  const pill = $('phasePill');
  pill.querySelector('i').style.background = state.phase === 'rest' ? 'var(--rest)' : `var(--${state.workType})`;
  const N = PHASE_NAMES[posture()];
  pill.querySelector('span').textContent = state.phase === 'pos' || state.phase === 'neg' ? N[state.phase][L1()] : w[state.phase] || w.rest;
  const gh = Math.round(state.gh), st = Math.round(state.st);
  const er = Math.round(state.er || 0), erTxt = er >= 3 ? (L ? ` · humeral ER <b>${er}°</b>` : ` · arm turned out <b>${er}°</b>`) : '';
  $('rhythm').innerHTML = (L ? `Glenohumeral <b>${gh}°</b> · scapulothoracic <b>${st}°</b>` : `Shoulder joint <b>${gh}°</b> + shoulder blade <b>${st}°</b>`) + erTxt;
  syncExPickers();
  updateCaption();
  $('effortBar').style.width = Math.round(Math.min(1, state.demand) * 100) + '%';
  updateMuscleList(); updateDetailStatus(); declutterLabels(); updateChartDot();
}
function syncButtons(){ $('btnLoop').setAttribute('aria-pressed', state.loop); }
function setPressed(ids, on){ ids.forEach(id => $(id).setAttribute('aria-pressed', id === on)); }

$('angle').addEventListener('input', e => { stopAnim(); state.goal = +e.target.value; });
$('btnPos').onclick = () => { state.loop = false; syncButtons(); playTo(175); };
$('btnNeg').onclick = () => { state.loop = false; syncButtons(); playTo(rng()[0] < 0 ? -45 : 0); };
$('btnLoop').onclick = () => {
  if (state.loop) return stopAnim();
  const [a, b] = POSTURES[posture()].loop, cur = state.goal;
  state.loop = true; state.loopDir = Math.abs(cur - b) < Math.abs(cur - a) ? -1 : 1; playTo(state.loopDir > 0 ? b : a); syncButtons();
};
$('go90').onclick = () => { state.loop = false; syncButtons(); playTo(90); };
function setMove(mv){
  if (mv === state.move) return;
  state.otherPlane = state.move; state.other = state.theta;
  state.move = mv; state.theta = state.goal = 0; state.vel = 0;
  setPressed(['mvFlex','mvAbd','mvScap'], { flex:'mvFlex', abd:'mvAbd', scap:'mvScap' }[mv]);
  setExercise(state.last[mv]);
  if (mv === 'scap' && !reduceMotion) flyIntro();
}
function syncSections(){
  const [lo, hi] = rng(), L = state.mode === 'learner', i = L ? 1 : 0, W = PW[plane()];
  $('angle').min = lo; $('angle').max = hi;
  $('go90').style.left = `calc(8px + (100% - 16px) * ${(90 - lo) / (hi - lo)})`;
  $('scaleL').textContent = W.lo[i]; $('scaleR').textContent = W.hi[i];
  $('posTxt').textContent = W.pos[i]; $('negTxt').textContent = W.neg[i];
  $('angleH').textContent = L ? 'Shoulder angle' : 'Arm angle';
  const G = GROUP_BTN[plane()];
  $('grpAName').textContent = G.A[i]; $('grpASub').textContent = G.A[2 + i];
  $('grpBName').textContent = G.B[i]; $('grpBSub').textContent = G.B[2 + i];
  $('loadSec').hidden = state.ex !== 'ext';
  $('echart').hidden = state.mode !== 'learner';
  drawChart();
}
function syncExPickers(){ setPressed(['grpA','grpB'], EX_OF[plane()][0] === state.ex ? 'grpA' : 'grpB'); }
// play the exercise on repeat: from wherever the arm is, to the far end of the range, then back and forth
function startExercise(){
  const P = POSTURES[posture()];
  state.loop = true; state.loopDir = 1; playTo(P.loop[1]); syncButtons();
}
function setExercise(ex){
  state.ex = ex; state.last[plane()] = ex; state.settle = 1.4;
  select(null); syncSections(); startExercise(); flyHome(); syncExPickers();
}
$('grpA').onclick = () => { const ex = EX_OF[plane()][0]; if (state.ex !== ex) setExercise(ex); };
$('grpB').onclick = () => { const ex = EX_OF[plane()][1]; if (state.ex !== ex) setExercise(ex); };
$('mvFlex').onclick = () => setMove('flex');
$('mvAbd').onclick = () => setMove('abd');
$('mvScap').onclick = () => setMove('scap');
function setLoad(l){ state.load = l; setPressed(['loadDb','loadBand'], l === 'db' ? 'loadDb' : 'loadBand'); setExercise('ext'); }
$('loadDb').onclick = () => { if (state.load !== 'db') setLoad('db'); };
$('loadBand').onclick = () => { if (state.load !== 'band') setLoad('band'); };
$('zoomIn').onclick = () => zoom(.8);
$('zoomOut').onclick = () => zoom(1.25);
addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  if (e.key === '+' || e.key === '=') zoom(.8); else if (e.key === '-' || e.key === '_') zoom(1.25);
});
const TOGGLES = {
  labels: on => { showLabels = on; },
  bones:  on => { showBones = on; boneParts.forEach(b => b.visible = on); },
  planes: on => { showPlanes = on; },
  arc:    on => { showArc = on; arcGroup.traverse(o => { if (o === arcGroup || o.isCSS2DObject) o.visible = on; }); },
  body:   on => { showBody = on; silhouette.visible = on; armSkin.forEach(m => m.visible = on); handSkin.visible = on; },
};
document.querySelectorAll('input[data-t]').forEach(inp => inp.onchange = () => {
  TOGGLES[inp.dataset.t](inp.checked);
  document.querySelectorAll(`input[data-t="${inp.dataset.t}"]`).forEach(o => o.checked = inp.checked);
});
function setViewMenu(open){ $('viewMenu').hidden = !open; $('viewMenuBtn').setAttribute('aria-expanded', open); }
$('viewMenuBtn').onclick = e => { e.stopPropagation(); setViewMenu($('viewMenu').hidden); };
addEventListener('pointerdown', e => { if (!e.target.closest('.viewmenu')) setViewMenu(false); });
addEventListener('keydown', e => { if (e.key === 'Escape'){ setViewMenu(false); closeMore(); } });
$('resetView').onclick = () => { select(null); flyHome(); };

function setMode(mode){
  state.mode = mode;
  setPressed(['modePatient','modeLearner'], mode === 'patient' ? 'modePatient' : 'modeLearner');
  const L = mode === 'learner';
  document.querySelectorAll('small[data-l]').forEach(s => { s.dataset.p ??= s.textContent; s.textContent = L ? s.dataset.l : s.dataset.p; s.style.display = s.textContent ? '' : 'none'; });
  document.querySelectorAll('[data-lt]').forEach(s => { s.dataset.p ??= s.textContent; s.textContent = L ? s.dataset.lt : s.dataset.p; });
  renderMuscleList(); renderDetail(); renderJoint(); syncSections();
}
$('modePatient').onclick = () => setMode('patient');
$('modeLearner').onclick = () => setMode('learner');

function applyTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem('myotrek-theme', t); } catch {} readTokens(); }
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
let savedTheme = null; try { savedTheme = localStorage.getItem('myotrek-theme'); } catch {}
applyTheme(savedTheme || 'light');

/* ------------------------------------------------------------------ resize + loop */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const wide = innerWidth > 900;
  homeDist = (wide ? 17 : 19) * Math.max(1, (wide ? 1.1 : .85) / camera.aspect);
}
new ResizeObserver(resize).observe(stage);
resize();
camera.position.copy(homeTarget()).addScaledVector(homeDir(), homeDistance());
controls.target.copy(homeTarget());

setMode('patient');
syncExPickers();
if (reduceMotion){ state.goal = state.theta = 60; }
else startExercise();

// handle for automated rendering checks
window.myotrek = { state, MUSCLES, TUBES, camera, controls, body };
const clock = new THREE.Clock();
let hudT = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  stepMotion(dt);
  updateKinematics();
  updatePhysiology(dt);
  updateMuscleGeometry();
  updateAppearance(t);
  updateArc();
  stepTween(dt);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if ((hudT += dt) > .08){ hudT = 0; updateHUD(); }
});
</script>
