<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Myotrek joint (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Shared rough page for every joint after the knee: one layout, each joint described by data below. */
:root{
  --bg:#E9EEF1; --bg-2:#F7FAFB; --panel:rgba(255,255,255,.88); --panel-solid:#FFFFFF;
  --line:rgba(22,44,60,.11); --fg:#16222C; --fg-2:#4C5B68; --fg-3:#7C8994;
  --accent:#0B6B70; --accent-soft:#D6EBEB; --accent-fg:#FFFFFF;
  --con:#D9472B; --ecc:#4F55D0; --iso:#C88A10; --rest:#C49590;
  --bone:#ECE5D5; --skin:#E6C2AC; --shadow:0 10px 30px -12px rgba(20,40,60,.25), 0 1px 2px rgba(20,40,60,.06);
  --font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1318; --bg-2:#1A222B; --panel:rgba(22,29,37,.9); --panel-solid:#18202A;
  --line:rgba(255,255,255,.09); --fg:#E6ECF1; --fg-2:#A7B3BE; --fg-3:#76838F;
  --accent:#4FC2C3; --accent-soft:rgba(79,194,195,.15); --accent-fg:#06272A;
  --con:#FF6A4D; --ecc:#8C90FF; --iso:#F0B43C; --rest:#A97F7B;
  --bone:#D6CEBD; --skin:#C9A28C; --shadow:0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1318; --bg-2:#1A222B; --panel:rgba(22,29,37,.9); --panel-solid:#18202A;
  --line:rgba(255,255,255,.09); --fg:#E6ECF1; --fg-2:#A7B3BE; --fg-3:#76838F;
  --accent:#4FC2C3; --accent-soft:rgba(79,194,195,.15); --accent-fg:#06272A;
  --con:#FF6A4D; --ecc:#8C90FF; --iso:#F0B43C; --rest:#A97F7B;
  --bone:#D6CEBD; --skin:#C9A28C; --shadow:0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark }

html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--fg); font:15px/1.5 var(--font-body); overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.app{position:relative; height:100%; background:radial-gradient(ellipse 60% 70% at 52% 46%, var(--bg-2), var(--bg) 75%)}
#stage{position:absolute; inset:0}
#stage canvas{display:block; width:100%; height:100%; touch-action:none}
.labels{position:absolute; inset:0; pointer-events:none; z-index:1}

.top{position:absolute; top:16px; left:16px; right:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; pointer-events:none; z-index:5}
.top > *{pointer-events:auto}
.brand{display:flex; align-items:center; gap:10px}
.brand b{font:700 21px/1 var(--font-display)}
.crumb{color:var(--fg-3); font-size:13px}
.crumb strong{color:var(--fg-2)}
.backlink{display:inline-flex; align-items:center; gap:4px; padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font-weight:700; font-size:13px; text-decoration:none}
.backlink:hover{border-color:var(--accent); color:var(--accent)}
.draft{font:700 11px/1 var(--font-body); letter-spacing:.06em; text-transform:uppercase; color:var(--fg-3); background:var(--accent-soft); padding:4px 8px; border-radius:999px}
.top-right{display:flex; gap:8px; align-items:center}
.seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px}
.seg button{border:0; background:transparent; padding:6px 12px; border-radius:999px; cursor:pointer; font-size:13px; color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); font-weight:700}
.seg.block{display:flex; border-radius:10px}
.seg.block button{flex:1; border-radius:8px; padding:7px 6px; display:flex; flex-direction:column; align-items:center; gap:1px}
.seg.block small{font-size:11px; opacity:.8}
.iconbtn{width:36px; height:36px; display:grid; place-items:center; border-radius:999px; border:1px solid var(--line); background:var(--panel); cursor:pointer}
.iconbtn svg{width:18px; height:18px}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow)}
.controls{position:absolute; left:16px; top:72px; width:290px; max-height:calc(100% - 88px); overflow:auto; padding:16px; display:flex; flex-direction:column; gap:18px; z-index:4}
.info{position:absolute; right:16px; top:72px; bottom:16px; width:340px; overflow:auto; padding:14px 16px; z-index:4; display:flex; flex-direction:column; gap:12px}
h3{margin:0 0 8px; font:700 11px/1.2 var(--font-body); letter-spacing:.09em; text-transform:uppercase; color:var(--fg-3)}
.readout{display:flex; align-items:baseline; gap:8px; margin-bottom:6px; flex-wrap:wrap}
.readout .num{font:500 40px/1 var(--font-mono); font-variant-numeric:tabular-nums}
.readout .deg{font:500 22px/1 var(--font-mono); color:var(--fg-3); margin-left:-6px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; background:var(--accent-soft); white-space:nowrap}
.pill i{width:8px; height:8px; border-radius:50%; background:var(--fg-3)}
input[type=range]{width:100%; accent-color:var(--accent); margin:6px 0 2px}
.scale{display:flex; justify-content:space-between; font-size:11.5px; color:var(--fg-3)}
.btnrow{display:flex; gap:6px; margin-top:10px}
.btn{flex:1; border:1px solid var(--line); background:var(--panel-solid); padding:8px 6px; border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); border-color:transparent}
.note{font-size:12.5px; color:var(--fg-3); margin:0}

.mrow{display:grid; grid-template-columns:12px 1fr auto; gap:4px 10px; align-items:center; text-align:left; padding:9px 10px; border:1px solid var(--line); border-radius:11px; background:var(--panel-solid); cursor:pointer; width:100%; margin-bottom:6px}
.mrow:hover{border-color:var(--accent)}
.mrow .dot{width:12px; height:12px; border-radius:50%; background:var(--rest); grid-row:span 2}
.mrow .nm{font-weight:700; font-size:14px}
.mrow .role{font-size:11.5px; color:var(--fg-2)}
.mrow .st{font-size:12.5px; color:var(--fg-2)}
.mrow .bar{grid-column:2 / 4; height:4px; border-radius:2px; background:var(--line); overflow:hidden}
.mrow .bar span{display:block; height:100%; width:0; border-radius:2px}
.detail h2{font:700 22px/1.15 var(--font-display); margin:0}
.kv{display:grid; gap:8px; margin:0}
.kv dt{font:700 11px/1.3 var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3)}
.kv dd{margin:0; font-size:14px}
.linkbtn{border:0; background:none; color:var(--accent); font-weight:700; cursor:pointer; padding:0; font-size:13px; align-self:flex-start}
.legend{display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:12.5px; color:var(--fg-2); padding-top:10px; border-top:1px solid var(--line)}
.legend span{display:flex; align-items:center; gap:7px}
.legend i{width:10px; height:10px; border-radius:50%}

.caption{position:absolute; left:322px; right:372px; bottom:16px; display:flex; justify-content:center; z-index:6; pointer-events:none}
.caption .panel{pointer-events:auto; height:52px; width:100%; max-width:600px; padding:0 16px; display:flex; align-items:center}
.caption p{margin:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tag{pointer-events:auto; cursor:pointer; border:1px solid var(--line); background:var(--panel-solid); color:var(--fg); font:700 11.5px/1 var(--font-body); padding:5px 8px; border-radius:999px; white-space:nowrap; box-shadow:var(--shadow)}
.tag.on{border-color:var(--accent); color:var(--accent)}
.tag.dim{opacity:.35}

@media (max-width: 900px){
  body{overflow:auto}
  .app{height:auto; min-height:100%}
  #stage{position:relative; height:58vh; min-height:340px}
  .crumb{display:none}
  .controls,.info{position:static; width:auto; max-height:none; margin:0 16px 12px}
  .caption{position:static; margin:0 16px 12px}
}
</style>
</head>
<body>
<div class="app">
  <div id="stage"></div>
  <header class="top">
    <div class="brand">
      <a class="backlink" href="./">← Body</a>
      <b>Myotrek</b>
      <span class="crumb"><span id="regionTxt"></span> / <strong id="jointTxt"></strong> <span id="sideTxt"></span></span>
      <span class="draft">Rough draft</span>
    </div>
    <div class="top-right">
      <div class="seg" role="group" aria-label="Explanation level">
        <button id="modeSimple" aria-pressed="false">Simple</button>
        <button id="modeClinical" aria-pressed="true">Clinical</button>
      </div>
      <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark theme" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </div>
  </header>

  <aside class="controls panel" aria-label="Controls">
    <section>
      <h3>Exercise</h3>
      <div class="seg block" role="group" aria-label="Exercise" id="exButtons"></div>
    </section>
    <section>
      <h3 id="angleTitle">Joint angle</h3>
      <div class="readout"><span class="num" id="angleVal">0</span><span class="deg">°</span><span class="pill" id="pill"><i></i><span>Resting</span></span></div>
      <input type="range" id="angle" step="1" aria-label="Joint angle in degrees">
      <div class="scale"><span id="scaleMin"></span><span id="scaleMax"></span></div>
      <div class="btnrow">
        <button class="btn" id="btnPos"></button>
        <button class="btn" id="btnNeg"></button>
        <button class="btn" id="btnLoop" aria-pressed="true">Repeat</button>
      </div>
    </section>
    <p class="note">Rough first draft, following the knee's layout. Content not yet reviewed.</p>
  </aside>

  <aside class="info panel" aria-label="Muscles">
    <div id="paneList"></div>
    <div id="paneDetail" hidden></div>
  </aside>

  <div class="caption"><div class="panel"><p id="headTxt"></p></div></div>
</div>

   Points and meshes carry a fraction f: 0 = fixed (proximal), 1 = moves fully with the distal part, 0.5 = half
   (tissue wrapping round the joint, or vertebrae in the middle of a spinal segment).
   Bones: ['cap', f, a, b, r] capsule · ['ell', f, centre, scale] ellipsoid · ['ghost', f, centre, scale] faint outline.

/* ------------------------------------------------------------------ muscles (same tube + stripe technique as the elbow) */
function muscleMaterial(){
  const m = new THREE.MeshPhysicalMaterial({ roughness:.42, clearcoat:.35, sheen:.4, envMapIntensity:.55, transparent:true });
  m.userData.u = { uTime:{value:0}, uFlow:{value:0}, uActive:{value:0}, uStripe:{value:new THREE.Color()} };
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, m.userData.u);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', 'attribute float along;\nvarying float vAlong;\n#include <common>')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvAlong = along;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', 'uniform float uTime; uniform float uFlow; uniform float uActive; uniform vec3 uStripe;\nvarying float vAlong;\n#include <common>')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float stripe = smoothstep(0.35, 0.95, 0.5 + 0.5 * sin(abs(vAlong - 0.5) * 46.0 + uTime * uFlow * 5.0));
        float glow = (abs(uFlow) < 0.5) ? (0.18 + 0.22 * (0.5 + 0.5 * sin(uTime * 3.5))) : (0.12 + 0.5 * stripe);
        totalEmissiveRadiance += uStripe * uActive * glow;`);
  };
  return m;
}
const SEGS = 56, RAD = 18;
function makeTube(){
  const g = new THREE.BufferGeometry(), n = (SEGS+1)*(RAD+1), along = new Float32Array(n), idx = [];
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(n*3), 3));
  for (let i=0;i<=SEGS;i++) for (let j=0;j<=RAD;j++) along[i*(RAD+1)+j] = i/SEGS;
  for (let i=0;i<SEGS;i++) for (let j=0;j<RAD;j++){ const a=i*(RAD+1)+j, b=a+RAD+1; idx.push(a,a+1,b, a+1,b+1,b); }
  g.setAttribute('along', new THREE.BufferAttribute(along, 1)); g.setIndex(idx); return g;
}
const _T = new V3(), _N = new V3(), _B = new V3(), _ref = new V3(0,0,1);
function updateTube(g, curve, rFn){
  const pos = g.attributes.position.array, nor = g.attributes.normal.array, pts = curve.getSpacedPoints(SEGS); let k = 0;
  for (let i=0;i<=SEGS;i++){
    curve.getTangentAt(i/SEGS, _T); _N.crossVectors(_ref, _T); if (_N.lengthSq() < 1e-6) _N.set(1,0,0); _N.normalize(); _B.crossVectors(_T, _N);
    const r = rFn(i/SEGS), P = pts[i];
    for (let j=0;j<=RAD;j++){ const a = j/RAD*Math.PI*2, c = Math.cos(a), s = Math.sin(a);
      const nx = c*_N.x+s*_B.x, ny = c*_N.y+s*_B.y, nz = c*_N.z+s*_B.z;
      pos[k*3]=P.x+r*nx; pos[k*3+1]=P.y+r*ny; pos[k*3+2]=P.z+r*nz; nor[k*3]=nx; nor[k*3+1]=ny; nor[k*3+2]=nz; k++; }
  }
  g.attributes.position.needsUpdate = g.attributes.normal.needsUpdate = true; g.computeBoundingSphere();
}
const belly = (u, r) => .04 + (r - .04) * Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, (u - .05) / .85))), .8);
// a point that moves with fraction f of the joint angle
function resolve([f, x, y, z], out){ const a = -state.theta*DEG*f, c = Math.cos(a), s = Math.sin(a); return out.set(x*c - y*s, x*s + y*c, z); }
const muscleMeshes = [];
for (const m of J.muscles){
  m.f ??= 1; m.act = 0; m.contraction = 'rel'; m.role = null;
  m.tubeObjs = m.tubes.map(t => { const mat = muscleMaterial(), geo = makeTube(), mesh = new THREE.Mesh(geo, mat);
    mesh.userData.muscle = m; rig.add(mesh); muscleMeshes.push(mesh); return { t, mat, geo, pts:t.pts.map(() => new V3()), L0:1, curve:null }; });
  const el = document.createElement('button'); el.className = 'tag'; el.textContent = m.short;
  el.onclick = e => { e.stopPropagation(); select(m); };
  m.labelEl = el; m.label3d = new CSS2DObject(el); rig.add(m.label3d);
}
function updateTransforms(){ rig.rotation.z = state.rot*DEG; for (const [f, g] of segs) g.rotation.z = -state.theta*DEG*f; }
function updateMuscles(){
  for (const m of J.muscles){
    for (const o of m.tubeObjs){
      o.t.pts.forEach((p, i) => resolve(p, o.pts[i]));
      o.curve = new THREE.CatmullRomCurve3(o.pts, false, 'centripetal');
      const r = o.t.r * THREE.MathUtils.clamp(Math.pow(o.L0 / o.curve.getLength(), .8), .75, 1.5) * (1 + .15 * m.act * (m.contraction === 'rel' ? 0 : 1));
      updateTube(o.geo, o.curve, u => belly(u, r));
    }
    m.label3d.position.copy(m.tubeObjs[0].curve.getPointAt(m.label));
  }
}

/* ------------------------------------------------------------------ physiology: the load's pull decides which group works */
const OPPOSITE = { con:'ecc', ecc:'con', iso:'iso' };
const _p = new V3();
// > 0: the load pulls toward a bigger angle (so the "neg" group must resist); < 0: toward a smaller angle
function loadPull(){
  const E = J.exercises[state.ex];
  if (E.pull) return E.pull * .8;                                                 // body weight or a band: steady pull
  resolve([1, ...J.load.at], _p).applyAxisAngle(new V3(0,0,1), state.rot*DEG);    // gravity on the load
  return _p.x / Math.max(.001, Math.hypot(_p.x, _p.y));
}
function updatePhysiology(dt){
  const v = state.vel, moving = Math.abs(v) > 4, pull = loadPull();
  let phase = moving ? (v > 0 ? 'pos' : 'neg') : 'hold';
  const workGroup = pull > 0 ? 'neg' : 'pos';
  if (phase === 'hold' && Math.abs(pull) < .12) phase = 'rest';
  const type = phase === 'hold' ? 'iso' : phase === workGroup ? 'con' : 'ecc';
  const demand = phase === 'rest' ? 0 : (.18 + .82*Math.abs(pull)) * (type === 'ecc' ? .72 : 1);
  Object.assign(state, { phase, workGroup, workType:type });
  state.demand += (demand - state.demand) * (1 - Math.exp(-dt*8));
  const coact = .06 + .04*demand;
  for (const m of J.muscles){
    let target = .02, c = 'rel', role = null;
    if (phase !== 'rest'){
      if (m.group === workGroup){ target = demand*m.f; c = type; role = m.f >= .95 ? 'prime' : 'syn'; }
      else { target = coact; c = OPPOSITE[type]; role = 'ant'; }
    }
    m.act += (target - m.act) * (1 - Math.exp(-dt*8)); m.contraction = c; m.role = role;
  }
}

/* ------------------------------------------------------------------ appearance, motion */
const C = {}, _col = new THREE.Color(), _v = new V3(), _v2 = new V3();
function readTokens(){
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['con','ecc','iso','rest','bone','skin','fg-3']) C[k] = new THREE.Color(cs.getPropertyValue('--'+k).trim());
  boneMat.color.copy(C.bone); ghostMat.color.copy(C.skin); loadArrow.setColor(C['fg-3']);
}
function updateAppearance(time){
  for (const m of J.muscles){
    const sc = m.contraction === 'rel' ? C.rest : C[m.contraction], faded = state.selected && state.selected !== m;
    for (const o of m.tubeObjs){
      const u = o.mat.userData.u;
      o.mat.color.copy(_col.copy(C.rest).lerp(sc, Math.min(1, m.act*1.25) * .9));
      u.uTime.value = reduceMotion ? 0 : time; u.uFlow.value = m.contraction === 'con' ? 1 : m.contraction === 'ecc' ? -1 : 0;
      u.uActive.value = m.contraction === 'rel' ? 0 : Math.min(1, m.act*1.2); u.uStripe.value.copy(sc);
      o.mat.opacity = faded ? .16 : 1; o.mat.depthWrite = !faded;
    }
    m.labelEl.classList.toggle('dim', !!faded); m.labelEl.classList.toggle('on', state.selected === m);
  }
  scene.updateMatrixWorld(true);
  loadObj.getWorldPosition(_v);
  const E = J.exercises[state.ex];
  if (E.pull){   // steady pull: draw it along the direction it turns the joint
    const d = Math.sign(E.pull);
    resolve([1, ...J.load.at], _v2); const a = _v2.clone(); state.theta += d; resolve([1, ...J.load.at], _v2); state.theta -= d;
    const dir = _v2.sub(a).applyAxisAngle(new V3(0,0,1), state.rot*DEG); dir.z *= zs; dir.normalize();
    loadArrow.position.copy(_v).addScaledVector(dir, -.9); loadArrow.setDirection(dir); loadArrow.setLength(.85, .22, .14);
  } else { loadArrow.position.copy(_v).add(new V3(0,-.4,0)); loadArrow.setDirection(new V3(0,-1,0)); loadArrow.setLength(.8 + .5*state.demand, .22, .14); }
}
function playTo(to){ state.anim = { to }; state.hold = 0; }
function stepMotion(dt){
  if (state.hold > 0) state.hold -= dt;
  else if (state.anim){
    const d = state.anim.to - state.goal, s = 50 * THREE.MathUtils.clamp(.3 + Math.abs(d)/35, .3, 1) * dt;
    if (Math.abs(d) <= s){
      state.goal = state.anim.to;
      if (state.loop){ const [a, b] = J.exercises[state.ex].loop; state.loopDir *= -1; state.anim = { to: state.loopDir > 0 ? b : a }; state.hold = .8; }
      else { state.anim = null; syncButtons(); }
    } else state.goal += Math.sign(d) * s;
  }
  const prev = state.theta;
  state.theta += (state.goal - state.theta) * (1 - Math.exp(-dt*14));
  state.vel += ((state.theta - prev) / Math.max(dt, 1e-3) - state.vel) * (1 - Math.exp(-dt*12));
  let target = J.exercises[state.ex].rot, d = ((target - state.rot + 540) % 360) - 180;     // turn the short way round
  state.rot += d * (1 - Math.exp(-dt*3.2));
}

/* ------------------------------------------------------------------ camera */
let tween = null, camScale = 1;
const viewDir = new V3(J.view[0], J.view[1], J.view[2]*zs).normalize();
const homeTarget = () => new V3(...J.exercises[state.ex].target).multiply(new V3(1,1,zs));
const homeDist = () => J.exercises[state.ex].dist * camScale;
function flyHome(){ tween = { t:0, t0:controls.target.clone(), t1:homeTarget(), p0:camera.position.clone() }; tween.p1 = tween.t1.clone().addScaledVector(viewDir, homeDist()); }
function stepTween(dt){
  if (!tween) return;
  tween.t = Math.min(1, tween.t + dt/.9); const e = tween.t < .5 ? 4*tween.t**3 : 1 - Math.pow(-2*tween.t + 2, 3)/2;
  controls.target.lerpVectors(tween.t0, tween.t1, e); camera.position.lerpVectors(tween.p0, tween.p1, e);
  if (tween.t >= 1) tween = null;
}

/* ------------------------------------------------------------------ UI */
const WORDS = {
  simple:{ con:'Shortening', ecc:'Lengthening to control', iso:'Holding', rel:'Resting', prime:'Main mover', syn:'Helper', ant:'Opposite side', hold:'Holding', rest:'Resting', coact:'Lightly on, steadying' },
  clinical:{ con:'Concentric', ecc:'Eccentric', iso:'Isometric', rel:'Relaxed', prime:'Prime mover', syn:'Synergist', ant:'Antagonist', hold:'Isometric hold', rest:'At rest', coact:'Low-level co-activation' },
};
const L = () => state.mode === 'clinical' ? 1 : 0;
const W = () => WORDS[state.mode];
const phaseWord = p => p === 'pos' || p === 'neg' ? J.moves[p][L()] : W()[p];
function select(m){ state.selected = m; renderDetail(); }
renderer.domElement.addEventListener('click', e => {
  const r = renderer.domElement.getBoundingClientRect(), ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1), camera);
  const hit = ray.intersectObjects(muscleMeshes, false)[0]; select(hit ? hit.object.userData.muscle : null);
});
function statusText(m){ const w = W(); if (!m.role) return w.rel; if (m.role === 'ant') return m.act > .04 ? w.coact : w.rel; return w[m.contraction]; }
const colorVar = m => m.contraction === 'rel' || (m.role === 'ant' && m.act <= .04) ? 'var(--rest)' : `var(--${m.contraction})`;
function renderList(){
  const w = W();
  $('paneList').innerHTML = ['pos','neg'].map(g => `<h3>${J.groups[g][L()]}</h3>` + J.muscles.filter(m => m.group === g).map(m => `
    <button class="mrow" data-id="${m.id}"><i class="dot"></i><span class="nm">${m.name}</span><span class="role"></span><span class="st"></span><span class="bar"><span></span></span></button>`).join('')).join('') + `
    <div class="legend"><span><i style="background:var(--con)"></i>${w.con}</span><span><i style="background:var(--ecc)"></i>${w.ecc}</span>
    <span><i style="background:var(--iso)"></i>${w.iso}</span><span><i style="background:var(--rest)"></i>${w.rel}</span></div>`;
  document.querySelectorAll('.mrow').forEach(b => b.onclick = () => select(J.muscles.find(m => m.id === b.dataset.id)));
}
function renderDetail(){
  const m = state.selected; $('paneDetail').hidden = !m; $('paneList').hidden = !!m;
  if (!m) return;
  $('paneDetail').innerHTML = `<button class="linkbtn" id="back">← All muscles</button>
    <div class="detail"><h2>${m.name}</h2></div><p style="margin:0">${m.plain}</p>
    ${L() ? `<dl class="kv"><dt>Origin</dt><dd>${m.origin}</dd><dt>Insertion</dt><dd>${m.insertion}</dd><dt>Innervation</dt><dd>${m.nerve}</dd><dt>Action</dt><dd>${m.action}</dd></dl>` : ''}
    <p class="note">Draft content, not yet reviewed.</p>`;
  $('back').onclick = () => select(null);
}
function renderControls(){
  $('exButtons').innerHTML = EXK.map(k => `<button data-ex="${k}" aria-pressed="${k === state.ex}">${J.exercises[k].name}<small>${J.exercises[k].sub}</small></button>`).join('');
  $('exButtons').querySelectorAll('button').forEach(b => b.onclick = () => setExercise(b.dataset.ex));
  $('angleTitle').textContent = `${J.name} angle`;
  $('scaleMin').textContent = `${MIN}° ${J.scale[0][L()]}`; $('scaleMax').textContent = `${MAX}° ${J.scale[1][L()]}`;
  $('btnPos').textContent = J.moves.pos[L()]; $('btnNeg').textContent = J.moves.neg[L()];
}
function updateHUD(){
  const w = W();
  $('angleVal').textContent = Math.round(state.theta);
  if (document.activeElement !== $('angle')) $('angle').value = Math.round(state.goal);
  $('pill').querySelector('i').style.background = state.phase === 'rest' ? 'var(--rest)' : `var(--${state.workType})`;
  $('pill').querySelector('span').textContent = phaseWord(state.phase);
  for (const m of J.muscles){
    const row = document.querySelector(`.mrow[data-id="${m.id}"]`); if (!row) continue;
    row.querySelector('.dot').style.background = colorVar(m);
    row.querySelector('.role').textContent = m.role ? w[m.role] : '';
    row.querySelector('.st').textContent = statusText(m);
    const bar = row.querySelector('.bar span'); bar.style.width = Math.round(Math.min(1, m.act)*100) + '%'; bar.style.background = colorVar(m);
  }
  const head = state.phase === 'rest' ? w.rest : `${phaseWord(state.phase)} · ${J.groups[state.workGroup][L()].toLowerCase()} ${w[state.workType].toLowerCase()}`;
  if ($('headTxt').textContent !== head) $('headTxt').textContent = head;
}
function syncButtons(){ $('btnLoop').setAttribute('aria-pressed', state.loop); }
function stopAnim(){ state.anim = null; state.loop = false; syncButtons(); }
$('angle').min = MIN; $('angle').max = MAX;
$('angle').addEventListener('input', e => { stopAnim(); state.goal = +e.target.value; });
$('btnPos').onclick = () => { state.loop = false; syncButtons(); playTo(MAX); };
$('btnNeg').onclick = () => { state.loop = false; syncButtons(); playTo(MIN); };
$('btnLoop').onclick = () => {
  if (state.loop) return stopAnim();
  const [, b] = J.exercises[state.ex].loop; state.loop = true; state.loopDir = 1; playTo(b); syncButtons();
};
function setExercise(ex){
  state.ex = ex; renderControls();
  const [a] = J.exercises[ex].loop; state.loop = true; state.loopDir = -1; playTo(a); syncButtons(); flyHome();
}
function setMode(mode){
  state.mode = mode;
  $('modeSimple').setAttribute('aria-pressed', mode === 'simple'); $('modeClinical').setAttribute('aria-pressed', mode === 'clinical');
  renderControls(); renderList(); renderDetail();
}
$('modeSimple').onclick = () => setMode('simple');
$('modeClinical').onclick = () => setMode('clinical');
function applyTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem('myotrek-theme', t); } catch {} readTokens(); }
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
let saved = null; try { saved = localStorage.getItem('myotrek-theme'); } catch {}
applyTheme(saved || 'light');

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  camScale = Math.max(1, (innerWidth > 900 ? 1.1 : .85) / camera.aspect);
}
new ResizeObserver(resize).observe(stage); resize();
controls.target.copy(homeTarget()); camera.position.copy(homeTarget()).addScaledVector(viewDir, homeDist());
setMode('clinical');
{ const [a, b] = J.exercises[state.ex].loop; state.theta = state.goal = a; if (reduceMotion){ state.loop = false; syncButtons(); } else { state.loopDir = 1; playTo(b); } }

const clock = new THREE.Clock(); let hudT = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  stepMotion(dt); updateTransforms(); updatePhysiology(dt); updateMuscles(); updateAppearance(t);
  stepTween(dt); controls.update();
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  if ((hudT += dt) > .08){ hudT = 0; updateHUD(); }
});
window.myotrekJoint = { state, J };
</script>
